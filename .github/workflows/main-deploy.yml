name: Main deploy
on:
  push:
    branches:
      - main
    paths:
      - 'infrastructure/**'
      - 'codes/**'
      - 'apps/web/**'
  workflow_dispatch:

jobs:
  infrastructure-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      api_url: ${{ steps.tf-outputs.outputs.api_url }}
      web_bucket: ${{ steps.tf-outputs.outputs.web_bucket }}
      cloudfront_id: ${{ steps.tf-outputs.outputs.cloudfront_id }}
    steps:
      - name: Getting Code
        uses: actions/checkout@v6
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.9"
          terraform_wrapper: false
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: arn:aws:iam::${{vars.AWS_ACCOUNT_ID}}:role/${{secrets.GitHubActionsDeployRole}}
          aws-region: ${{vars.AWS_REGION}}
      - name: Build Pillow Lambda layer
        run: |
          rm -rf layer/python infrastructure/terraform/modules/lambda/pillow_layer.zip
          mkdir -p layer/python
          docker run --rm \
            -v "$GITHUB_WORKSPACE/layer:/var/task/layer" \
            public.ecr.aws/sam/build-python3.14:latest \
            /bin/sh -c "pip install --no-cache-dir pillow -t /var/task/layer/python"
          cd layer
          zip -r ../infrastructure/terraform/modules/lambda/pillow_layer.zip python 
      - name: Terraform init
        working-directory: infrastructure/terraform
        run: terraform init -input=false
      - name: Terraform apply
        working-directory: infrastructure/terraform
        run: terraform apply -auto-approve -var="admin_email=${{ secrets.ADMIN_EMAIL }}"
      - name: Export Terraform outputs
        id: tf-outputs
        working-directory: infrastructure/terraform
        run: |
          echo "api_url=$(terraform output -raw api_stage_invoke_url)" >> "$GITHUB_OUTPUT"
          echo "web_bucket=$(terraform output -raw frontend_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "cloudfront_id=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"
      - name: Print website URL
        run: echo "🌐 Website live at https://compression.myshortly.tech"
      - name: Save all Terraform outputs as artifact
        working-directory: infrastructure/terraform
        run: terraform output -json > terraform-outputs.json
      - name: Upload Terraform outputs artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs
          path: infrastructure/terraform/terraform-outputs.json
          retention-days: 3

  web-deploy:
    needs: infrastructure-deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Getting Code
        uses: actions/checkout@v6
      - name: Setting up Node with caching
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install Dependencies
        working-directory: apps/web
        run: npm ci
      - name: Build
        working-directory: apps/web
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ needs.infrastructure-deploy.outputs.api_url }}
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: arn:aws:iam::${{vars.AWS_ACCOUNT_ID}}:role/${{secrets.GitHubActionsDeployRole}}
          aws-region: ${{vars.AWS_REGION}}
      - name: Deploy to S3 and invalidate CloudFront
        run: |
          aws s3 sync apps/web/dist s3://${{ needs.infrastructure-deploy.outputs.web_bucket }} --delete
          aws cloudfront create-invalidation --distribution-id ${{ needs.infrastructure-deploy.outputs.cloudfront_id }} --paths "/*"
